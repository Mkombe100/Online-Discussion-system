<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Room</title>

	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

	<link rel="stylesheet" href="../controlls/controlls.css">
  <link rel="stylesheet" type="text/css" href="demo.css">
  <style>
			*{
			margin:0;
			padding:0;
			box-sizing:border-box;
		}

		html,body{
			width:100%;
			height:100%;
			/* allow small overflow if needed on very small viewports */
			overflow:hidden;
			background-image:url("../assets/abc.jpg");
			background-repeat:no-repeat;
			background-size:cover;
			background-position:center;
			background-color:blue;
		}

		/* Main layout: left = chat (collapsed by default), center = room, right = controls */
		main{
	      display:grid;
	      /* default: chat collapsed (0), center takes remaining space, controls fixed */
	      grid-template-columns: 0px minmax(0, 1fr) 18rem;
	      width:100vw;
	      height:100vh;
	      position:relative;
	      transition:.3s;
	   }


	  main.chat-open{
	      /* when chat open, give it a fixed width (responsive) */
	      grid-template-columns: 320px minmax(0, 1fr) 18rem;
	  }

		.ViewPoint{
			display:flex;
			flex-direction:column;
			margin:8px;
			border:2px solid white;
			min-width:0; /* allow shrinking inside grid */
		}

		.video{
			display:flex;
			flex-direction:column;
		}

		#viewer{
			flex:1;
			position:relative;
			min-height:0; /* important for children to scroll/fit */
		}

		#pdfViewer,
		#screenViewer{
			width:100%;
			height:100%;
			border:none;
		}

		#screenViewer{
			display:none;
			object-fit:contain;
			background:black;
		}

		#video{
			width:100%;
			height:100%;
			object-fit:cover;
		}

		.videos{
			display: grid;
			/* stack videos on top of each other on narrow screens */
			grid-template-rows: 14rem 14rem 1fr;
			min-width:0;
		}

		.topVideo{
			flex:1;
			max-height:20rem;
			margin:8px;
			border:2px solid greenyellow;
			min-width:0;
		}

		.downVideo{
			flex:1;
			margin:8px;
			border:2px solid greenyellow;
		}

		.callCenter{
			background-color: darkred;
		}

    #chatPanel{
      width:0;
      overflow:hidden;
      color:white;
      display:flex;
      flex-direction:column;
      transition:.3s;
      border: solid 2px green;
      margin-top: 8px;
      margin-bottom: 8px;
      min-width:0;
    }


	  main.chat-open #chatPanel{
	      width:320px;
	  }

	.chatHeader{
	    height:60px;
	    display:flex;
	    justify-content:space-between;
	    align-items:center;
	    padding:0 15px;
	    border-bottom:1px solid #444;
	}

	.chatHeader button{
	    background:none;
	    border:none;
	    color:white;
	    cursor:pointer;
	    font-size:18px;
	}

	#chatMessages{
	    flex:1;
	    overflow-y:auto;
	    padding:15px;
	}

	.chatInput{
	    display:flex;
	    padding:10px;
	    gap:10px;
	    border-top:1px solid #444;
	}

	.chatInput input{
	    flex:1;
	    padding:10px;
	    border:none;
	    outline:none;
	    border-radius:8px;
	}

	.chatInput button{
	    width:45px;
	    border:none;
	    background:black;
	    color:white;
	    border-radius:8px;
	    cursor:pointer;
	}

	/* Controls wrapper should not overflow horizontally */
	.controls-wrapper{
		padding:8px;
	}

	.controlls{
		display:flex;
		flex-direction:column;
		gap:8px;
	}

	.but-con{
		background:rgba(0,0,0,0.6);
		color:white;
		border:none;
		padding:10px;
		border-radius:8px;
		cursor:pointer;
	}

  </style>

	</head>

<body>

<main>
  <div id="chatPanel">

    <div class="chatHeader">
        <h3>Meeting Chat</h3>

        <button id="closeChat">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <div id="chatMessages">

    </div>

    <div class="chatInput">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
        >

        <button id="sendMessage">
            <i class="fas fa-paper-plane"></i>
        </button>

    </div>

</div>

	<div class="ViewPoint" id="ViewPoint">

		<!-- Hidden PDF selector -->
		<input type="file" id="pdfFile" accept="application/pdf" hidden>

		<div id="viewer">

			<!-- PDF: use embed for more consistent in-browser rendering -->
			<embed id="pdfViewer" type="application/pdf" style="display:block;" />

			<!-- Screen Share -->
			<video id="screenViewer" autoplay playsinline></video>

		</div>

	</div>


	<div class="videos">

		<div class="topVideo">
			<video id="video" autoplay playsinline muted></video>
		</div>

		<div class="topVideo">
	
		</div>
        <div class="topVideo">
	
		</div>

	</div>


	<div class="controls-wrapper">

		<button class="toggle-btn" id="toggleBarBtn" type="button">
			<i class="fas fa-chevron-left" id="toggleIcon"></i>
		</button>

		<div class="controlls" id="controlsBar">

			<!-- Share Notes -->
			<button class="but-con" id="Ai" title="AI">
				<i class="fas fa-robot"></i>
			</button>

			<!-- Share Notes -->
			<button class="but-con" id="shareNotesBtn" title="Share Notes">
				<i class="fas fa-book"></i>
			</button>

			<!-- Call center -->
			<button class="but-con callCenter" title="Call Center">
				<i class="fas fa-phone"></i>
			</button>

			<!-- Share Screen -->
			<button class="but-con" id="shareScreenBtn" title="Share Screen">
				<i class="fas fa-desktop"></i>
			</button>

			<!-- Chat -->
			<button class="but-con" id="Chat" title="chat">
				<i class="fas fa-message"></i>
			</button>

      <button class="but-con" id="setting" title="Setting">
        <i class="fa-solid fa-gear"></i>
      </button>

		</div>

	</div>

</main>

<script src="../controlls/controlls.js"></script>
<script>
	
const video=document.getElementById("video");

async function requestMedia(){

	try{

		const stream=await navigator.mediaDevices.getUserMedia({
			video:true,
			audio:true
		});

		video.srcObject=stream;

	}catch(err){

		console.log(err);

		alert("Please allow Camera and Microphone permissions.");

	}

}

requestMedia();

// =================== PDF ===================

const shareNotesBtn=document.getElementById("shareNotesBtn");
const pdfInput=document.getElementById("pdfFile");
const pdfViewer=document.getElementById("pdfViewer");
const screenViewer=document.getElementById("screenViewer");
let currentPdfUrl = null;

shareNotesBtn.addEventListener("click",()=>{

	pdfInput.click();

});

pdfInput.addEventListener("change",function(){

	const file=this.files[0];

	if(!file) return;

	if(file.type!=="application/pdf"){

		alert("Please choose a PDF.");

		return;

	}

	// Revoke previous URL if any
	if(currentPdfUrl){
		URL.revokeObjectURL(currentPdfUrl);
		currentPdfUrl = null;
	}

	const url=URL.createObjectURL(file);
	currentPdfUrl = url;

	// Hide screen share
	screenViewer.style.display="none";
	if (screenViewer.srcObject) {
		// stop any active screen tracks if present (we only show screen when sharing)
		try{ screenViewer.srcObject.getTracks().forEach(t=>t.stop()); }catch(e){}
		screenViewer.srcObject = null;
	}

	// Show PDF
	pdfViewer.style.display="block";
	// embed uses the src attribute
	pdfViewer.src = url;

});


// =================== SCREEN SHARE ===================

const shareScreenBtn=document.getElementById("shareScreenBtn");
let screenStream = null;

async function startScreenShare(){
	try{
		screenStream = await navigator.mediaDevices.getDisplayMedia({
			video:true,
			audio:true
		});

		// Hide PDF
		pdfViewer.style.display="none";

		// Show Screen
		screenViewer.style.display="block";
		screenViewer.srcObject = screenStream;

		// When sharing stops from browser UI, clean up
		screenStream.getVideoTracks()[0].addEventListener('ended', () => {
			stopScreenShare();
		});

	}catch(err){
		console.log('Screen share error', err);
		// user may have cancelled or browser not supported
	}
}

function stopScreenShare(){
	if(!screenStream) return;

	try{
		screenStream.getTracks().forEach(track=>track.stop());
	}catch(e){
		console.warn('Error stopping screen tracks', e);
	}

	screenViewer.srcObject = null;
	screenViewer.style.display = 'none';

	// restore PDF if we have one
	if(currentPdfUrl){
		pdfViewer.style.display = 'block';
		pdfViewer.src = currentPdfUrl;
	} else {
		// nothing to show
		pdfViewer.style.display = 'none';
	}

	screenStream = null;
}

shareScreenBtn.addEventListener('click', async ()=>{
	// Toggle behaviour: if already sharing stop, else start
	if(screenStream){
		stopScreenShare();
	}else{
		await startScreenShare();
	}
});

//Chat interface
const main = document.querySelector("main");
      const chatBtn = document.getElementById("Chat");
      const closeChat = document.getElementById("closeChat");
      chatBtn.onclick = ()=>{
          main.classList.add("chat-open");
      };

      closeChat.onclick = ()=>{
          main.classList.remove("chat-open");
      };

// Clean up object URL when leaving page
window.addEventListener('beforeunload', ()=>{
	if(currentPdfUrl) URL.revokeObjectURL(currentPdfUrl);
	if(screenStream) stopScreenShare();
});

</script>

</body>
</html>

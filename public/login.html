<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kimbweta Online | Sign In</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #eef2f6;
      color: #172033;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-shell {
      width: min(960px, 100%);
      min-height: 560px;
      display: grid;
      grid-template-columns: 1fr 420px;
      background: #ffffff;
      border: 1px solid #d9e1ec;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(20, 34, 55, 0.12);
    }

    .brand-panel {
      background: linear-gradient(rgba(19, 39, 67, 0.84), rgba(19, 39, 67, 0.84)), url("bg.png");
      background-size: cover;
      background-position: center;
      color: white;
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-mark {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-copy h1 {
      font-size: 44px;
      line-height: 1.05;
      margin-bottom: 16px;
    }

    .brand-copy p {
      max-width: 460px;
      line-height: 1.7;
      color: #dbe7f5;
    }

    .login-panel {
      padding: 46px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-panel h2 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtext {
      color: #667085;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #344054;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 13px 14px;
      font: inherit;
      outline: none;
      margin-bottom: 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    input.error {
      border-color: #dc2626;
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.12);
    }

    .error-message {
      color: #dc2626;
      font-size: 12px;
      margin-top: -14px;
      margin-bottom: 14px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: #1d4ed8;
      color: white;
      font-weight: 700;
      padding: 14px 16px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      font-size: 16px;
    }

    .primary-btn:hover {
      background: #1e40af;
    }

    .primary-btn:active {
      transform: translateY(1px);
    }

    .primary-btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }

    .signup-row {
      margin-top: 24px;
      color: #667085;
      font-size: 14px;
      text-align: center;
    }

    .signup-row a {
      color: #1d4ed8;
      font-weight: 700;
      text-decoration: none;
    }

    .signup-row a:hover {
      text-decoration: underline;
    }

    .alert {
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .alert.show {
      display: block;
    }

    .alert.success {
      background: #d1fae5;
      border: 1px solid #6ee7b7;
      color: #065f46;
    }

    .alert.error {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #991b1b;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 780px) {
      .login-shell {
        grid-template-columns: 1fr;
      }

      .brand-panel {
        min-height: 260px;
        padding: 32px;
      }

      .brand-copy h1 {
        font-size: 34px;
      }

      .login-panel {
        padding: 34px 24px;
      }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="brand-panel">
      <div class="brand-mark">Kimbweta Online</div>
      <div class="brand-copy">
        <h1>Meet, teach, and discuss from anywhere.</h1>
        <p>Create quick meetings, organize study groups, and invite people with simple room or group codes.</p>
      </div>
    </section>

    <section class="login-panel">
      <div id="alertBox" class="alert"></div>

      <form id="loginForm">
        <h2>Sign in</h2>
        <p class="subtext">Access your dashboard and start a meeting in seconds.</p>

        <div>
          <label for="email">Email address</label>
          <input id="email" type="email" name="email" autocomplete="email" required>
          <div class="error-message"></div>
        </div>

        <div>
          <label for="password">Password</label>
          <input id="password" type="password" name="password" autocomplete="current-password" required>
          <div class="error-message"></div>
        </div>

        <button class="primary-btn" type="submit">
          <span id="btnText">Sign in</span>
        </button>
      </form>

      <p class="signup-row">New to Kimbweta? <a href="/sign-up">Create an account</a></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = form.querySelector('button[type="submit"]');
    const btnText = document.getElementById('btnText');

    // Show alert message
    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert show ${type}`;
      alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Hide alert message
    function hideAlert() {
      alertBox.classList.remove('show');
    }

    // Clear error styling
    function clearErrors() {
      form.querySelectorAll('input').forEach(input => {
        input.classList.remove('error');
        const errorMsg = input.parentElement.querySelector('.error-message');
        if (errorMsg) errorMsg.classList.remove('show');
      });
    }

    // Show field error
    function showFieldError(fieldName, message) {
      const input = form.querySelector(`[name="${fieldName}"]`);
      if (input) {
        input.classList.add('error');
        const errorMsg = input.parentElement.querySelector('.error-message');
        if (errorMsg) {
          errorMsg.textContent = message;
          errorMsg.classList.add('show');
        }
      }
    }

    // Form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();
      hideAlert();

      // Get form data
      const formData = new FormData(form);
      const data = {
        email: formData.get('email').trim(),
        password: formData.get('password')
      };

      // Basic validation
      if (!data.email) {
        showFieldError('email', 'Email is required');
        return;
      }

      if (!data.password) {
        showFieldError('password', 'Password is required');
        return;
      }

      // Disable submit button and show loading state
      submitBtn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span>Signing in...';

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success) {
          showAlert('✓ ' + result.message, 'success');
          form.reset();
          
          // Redirect to dashboard
          setTimeout(() => {
            window.location.href = result.redirect || '/dashboard';
          }, 1500);
        } else {
          showAlert('✗ ' + result.message, 'error');
          submitBtn.disabled = false;
          btnText.textContent = 'Sign in';
        }

      } catch (err) {
        showAlert('✗ Sign in failed: ' + err.message, 'error');
        submitBtn.disabled = false;
        btnText.textContent = 'Sign in';
      }
    });

    // Real-time validation on input
    form.querySelectorAll('input').forEach(input => {
      input.addEventListener('blur', () => {
        if (input.value.trim()) {
          input.classList.remove('error');
          const errorMsg = input.parentElement.querySelector('.error-message');
          if (errorMsg) errorMsg.classList.remove('show');
        }
      });
    });
  </script>
</body>
</html>
